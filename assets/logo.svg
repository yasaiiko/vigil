<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="vigil - walk-forward tests for betting markets">
  <title>vigil</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="sweep" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="260" rx="22" fill="url(#bg)"/>

  <!-- watcher: concentric rings + rotating sweep -->
  <g transform="translate(130 130)">
    <circle r="78" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="1.5"/>
    <circle r="52" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle r="26" fill="none" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5"/>
    <line x1="-78" y1="0" x2="78" y2="0" stroke="#38bdf8" stroke-opacity="0.15"/>
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#38bdf8" stroke-opacity="0.15"/>
    <g>
      <path d="M0 0 L78 0 A78 78 0 0 0 55.2 -55.2 Z" fill="url(#sweep)"/>
      <line x1="0" y1="0" x2="78" y2="0" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
    </g>
    <circle r="5" fill="#e0f2fe">
      <animate attributeName="r" values="4;7;4" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="250" y="140" font-family="SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace" font-size="68" font-weight="700" fill="#e6edf3" letter-spacing="4">vigil</text>
  <text x="252" y="176" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#8b949e" letter-spacing="1.2">walk-forward tests for betting markets</text>
  <text x="252" y="200" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#6e7681" letter-spacing="1">the margin always collects; prove the rest</text>

  <!-- break-even line and a noisy "edge" curve that keeps returning to it -->
  <line x1="560" y1="130" x2="870" y2="130" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="5 5"/>
  <polyline points="560,134 585,112 610,146 635,118 660,138 685,100 710,142 735,160 760,128 785,112 810,144 835,124 860,132"
            fill="none" stroke="url(#curve)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="620" stroke-dashoffset="620">
    <animate attributeName="stroke-dashoffset" values="620;0;0;620" keyTimes="0;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
  </polyline>
  <circle cx="860" cy="132" r="5" fill="#a78bfa">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.5;0.58;0.9;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;4;8;4;4" keyTimes="0;0.55;0.65;0.8;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="870" y="122" text-anchor="end" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#6e7681">break-even</text>
</svg>
